<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aaghaz AI | Chat</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- DESIGN SETTINGS --- */
        :root {
            --bg-body: #000000;
            --bg-sidebar: #050505;
            --input-bg: #18181b;
            --accent-green: #D4F614; 
            --accent-dim: rgba(212, 246, 20, 0.1);
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --border-color: #27272a;
            --sidebar-width: 270px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            height: 100vh;
            overflow: hidden; 
        }

        a { text-decoration: none; color: inherit; display: block; }
        ul { list-style: none; }
        button { cursor: pointer; border: none; outline: none; transition: 0.2s; }

        /* --- LAYOUT --- */
        .app-container { display: flex; height: 100vh; width: 100%; }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            height: 100%;
            display: flex; flex-direction: column;
            padding: 20px;
            flex-shrink: 0;
            z-index: 50;
            transition: transform 0.3s ease;
        }

        .logo { font-size: 1.5rem; font-weight: 800; margin-bottom: 30px; display: flex; gap: 10px; align-items: center; }
        .logo i { color: var(--accent-green); }

        .nav-item {
            padding: 12px 15px; border-radius: 8px; color: var(--text-muted);
            font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 12px; margin-bottom: 5px;
        }
        .nav-item:hover { background: #1a1a1a; color: white; }
        .nav-item i { width: 20px; text-align: center; }
        .nav-item.active { background: var(--accent-dim); color: var(--accent-green); border-left: 3px solid var(--accent-green); }

        /* --- CHAT AREA --- */
        .chat-container {
            flex: 1; display: flex; flex-direction: column;
            background-color: var(--bg-body); position: relative; height: 100%;
        }

        .chat-header {
            padding: 15px 25px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            height: 70px;
        }
        .model-selector {
            display: flex; align-items: center; gap: 10px;
            background: #18181b; padding: 8px 15px; border-radius: 20px; border: 1px solid #333;
        }
        .model-name { font-weight: 600; font-size: 0.9rem; color: white; }
        .model-badge { background: var(--accent-dim); color: var(--accent-green); font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; font-weight: 700; }

        /* Messages */
        .messages-window {
            flex: 1; overflow-y: auto; padding: 20px 10%;
            display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth;
        }
        .messages-window::-webkit-scrollbar { width: 6px; }
        .messages-window::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        .welcome-screen {
            height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; color: #555;
        }
        .welcome-icon { font-size: 3rem; margin-bottom: 15px; color: #333; }
        .welcome-text { font-size: 1.5rem; font-weight: 700; color: white; margin-bottom: 10px; }

        .message { display: flex; gap: 15px; max-width: 100%; animation: fadeIn 0.3s; }
        .msg-avatar { 
            width: 35px; height: 35px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
        }
        .ai-avatar { background: var(--accent-green); color: black; }
        .user-avatar { background: #333; color: white; }

        .msg-content {
            padding: 12px 18px; border-radius: 12px;
            font-size: 0.95rem; line-height: 1.6; max-width: 85%; word-wrap: break-word;
        }
        .message.ai .msg-content { background: transparent; color: #e5e5e5; padding-left: 0; }
        .message.ai .msg-content strong { color: white; font-weight: 700; }
        .message.user { flex-direction: row-reverse; }
        .message.user .msg-content { background: #222; color: white; border-top-right-radius: 2px; }

        /* Input Area */
        .input-wrapper { padding: 20px 10%; background: var(--bg-body); position: relative; }
        .input-box {
            background: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 8px 15px; display: flex; align-items: flex-end; gap: 10px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.2);
        }
        .input-box textarea {
            flex: 1; background: transparent; border: none; outline: none;
            color: white; resize: none; padding: 10px 0; font-size: 1rem; max-height: 150px;
        }
        .send-btn {
            width: 40px; height: 40px; background: var(--accent-green); color: black;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1rem; margin-bottom: 3px;
        }
        .send-btn:disabled { background: #333; cursor: not-allowed; opacity: 0.5; }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 40; }
        .mobile-toggle { display: none; color: white; font-size: 1.5rem; background: none; }

        @media (max-width: 900px) {
            .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .overlay.active { display: block; }
            .mobile-toggle { display: block; }
            .messages-window, .input-wrapper { padding-left: 20px; padding-right: 20px; }
            .model-selector { margin-left: auto; margin-right: auto; }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="logo"><i class="fa-solid fa-bolt"></i> Aaghaz</div>
            <ul class="nav-menu">
                <li><a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i> Dashboard</a></li>
                <li><a href="#" class="nav-item"><i class="fa-solid fa-database"></i> Resources</a></li>
                <li><a href="#" class="nav-item active"><i class="fa-solid fa-comment-dots"></i> AI Chat</a></li>
                <li style="margin-top: auto;"><a href="#" class="nav-item"><i class="fa-solid fa-gear"></i> Settings</a></li>
                <li><a href="#" class="nav-item" style="color: #ef4444;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
            </ul>
        </aside>

        <!-- CHAT INTERFACE -->
        <main class="chat-container">
            <header class="chat-header">
                <button class="mobile-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                <div class="model-selector">
                    <i class="fa-solid fa-sparkles" style="color: gold;"></i>
                    <span class="model-name" id="currentModel">Auto Model</span>
                    <span class="model-badge">V1.5</span>
                </div>
                <div style="width: 24px;"></div>
            </header>

            <div class="messages-window" id="chatWindow">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon"><i class="fa-brands fa-rocketchat"></i></div>
                    <div class="welcome-text">How can I help you today?</div>
                    <p style="font-size: 0.9rem;">Start asking questions...</p>
                </div>
            </div>

            <div class="input-wrapper">
                <div class="input-box">
                    <textarea id="userInput" rows="1" placeholder="Message Aaghaz AI..." oninput="autoResize(this)"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </main>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // ---------------------------------------------------------
        // 👇👇 STEP 3: YAHAN APNI KEY PASTE KAREIN 👇👇
        // Make sure "HTTP Referrer" in Google Cloud includes your Vercel URL
        const API_KEY = "AIzaSyA5yK531AB6LJHvVa7PLRmC1ZR2vb-NGAU"; 
        // ---------------------------------------------------------

        const chatWindow = document.getElementById('chatWindow');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const currentModelLabel = document.getElementById('currentModel');

        // List of models to try in order of preference
        const MODELS_TO_TRY = [
            "gemini-1.5-flash",
            "gemini-1.5-pro",
            "gemini-2.0-flash-exp"
        ];
        
        let currentModelIndex = 0;

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
            if(textarea.value === '') textarea.style.height = 'auto';
        }

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            if(API_KEY.includes("PASTE_YOUR") || API_KEY === "") {
                alert("Please paste your API Key in the code first!");
                return;
            }

            if (welcomeScreen) welcomeScreen.style.display = 'none';
            addMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;

            const loadingId = 'loading-' + Date.now();
            addMessage('<i class="fa-solid fa-spinner fa-spin"></i> Thinking...', 'ai', loadingId);
            scrollToBottom();

            // Start trying to fetch with the first model
            await tryFetchModel(text, loadingId, 0);
            
            sendBtn.disabled = false;
        }

        // Recursive function to try models one by one
        async function tryFetchModel(text, loadingId, modelIndex) {
            if (modelIndex >= MODELS_TO_TRY.length) {
                document.getElementById(loadingId).remove();
                addMessage("All AI models failed. Please check your API Key or Network.", 'ai');
                return;
            }

            const modelName = MODELS_TO_TRY[modelIndex];
            console.log("Trying model:", modelName);

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                });

                const data = await response.json();

                if (data.error) {
                    console.warn(`Model ${modelName} failed:`, data.error.message);
                    
                    // Specific check for "Not Found" error to try next model
                    if (data.error.message.includes("not found") || data.error.message.includes("not supported")) {
                        // Try next model
                        await tryFetchModel(text, loadingId, modelIndex + 1);
                        return;
                    } 
                    
                    document.getElementById(loadingId).remove();
                    if(data.error.code === 403) {
                         addMessage("Access Denied (403): Check API Key Restrictions on Google Cloud. Add your Vercel URL.", 'ai');
                    } else {
                        addMessage(`API Error (${modelName}): ` + data.error.message, 'ai');
                    }
                } else if (data.candidates && data.candidates[0].content.parts[0].text) {
                    // Success!
                    document.getElementById(loadingId).remove();
                    const aiText = data.candidates[0].content.parts[0].text;
                    addMessage(formatText(aiText), 'ai');
                    
                    // Update UI to show which model worked
                    currentModelLabel.innerText = modelName.replace("gemini-", "").replace("-exp", "");
                } else {
                    document.getElementById(loadingId).remove();
                    addMessage("Empty response received.", 'ai');
                }

            } catch (error) {
                console.error("Network Error:", error);
                // Try next model on network error? usually no point, but let's try
                await tryFetchModel(text, loadingId, modelIndex + 1);
            }
        }

        function addMessage(text, sender, id = null) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            if (id) div.id = id;
            
            const avatarHTML = sender === 'user' 
                ? `<div class="msg-avatar user-avatar">U</div>`
                : `<div class="msg-avatar ai-avatar"><i class="fa-solid fa-bolt"></i></div>`;

            div.innerHTML = `${avatarHTML}<div class="msg-content">${text}</div>`;
            chatWindow.appendChild(div);
            scrollToBottom();
        }

        function formatText(text) {
            return text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
        }

        function scrollToBottom() { chatWindow.scrollTop = chatWindow.scrollHeight; }
    </script>

</body>
</html>
