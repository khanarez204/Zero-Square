<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- YE LINE ZAROORI HAI GOOGLE CLOUD RESTRICTIONS KE LIYE -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Aaghaz AI | Final</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #09090b; color: #fff; font-family: 'Manrope', sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        .header { padding: 15px; border-bottom: 1px solid #27272a; text-align: center; color: #D4F614; font-weight: bold; }
        .chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; line-height: 1.5; }
        .user { align-self: flex-end; background: #27272a; color: white; }
        .ai { align-self: flex-start; background: rgba(212, 246, 20, 0.1); border: 1px solid #3f3f46; color: #e4e4e7; }
        .input-area { padding: 20px; border-top: 1px solid #27272a; display: flex; gap: 10px; }
        input { flex: 1; background: #18181b; border: 1px solid #27272a; color: white; padding: 12px; border-radius: 8px; outline: none; }
        button { background: #D4F614; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; color: black; }
    </style>
</head>
<body>

    <div class="header">Aaghaz AI (Cloud Console Version)</div>
    <div class="chat-box" id="chat">
        <div class="msg ai">Hello! I am ready.</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type message...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        // 👇👇 YAHAN APNI CLOUD CONSOLE WALI KEY PASTE KAREIN 👇👇
        const API_KEY = "AIzaSyCgXWi5fsP2-Da2xbNOZMpbhGaggKFJvLE"; 
        // ---------------------------------------------------------

        const chat = document.getElementById('chat');

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;

            // User Message
            chat.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            // Loading
            const loadingId = 'load-' + Date.now();
            chat.innerHTML += `<div class="msg ai" id="${loadingId}">Checking Key...</div>`;

            try {
                // Fetch Request
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.error) {
                    // Detailed Error Handling
                    console.error("Full Error:", data.error);
                    let errorMsg = "Unknown Error";

                    if (data.error.message.includes("API key not valid")) {
                        errorMsg = "Invalid API Key: Please check if 'Generative Language API' is ENABLED in Cloud Console.";
                    } else if (data.error.code === 403) {
                        errorMsg = "Restriction Error: Key is restricted. Add 'https://*.vercel.app/*' to allowed websites.";
                    } else {
                        errorMsg = data.error.message;
                    }
                    
                    chat.innerHTML += `<div class="msg ai" style="color:#ff6b6b; border-color:#ff6b6b">${errorMsg}</div>`;
                } else {
                    const aiText = data.candidates[0].content.parts[0].text;
                    chat.innerHTML += `<div class="msg ai">${aiText.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')}</div>`;
                }

            } catch (error) {
                if(document.getElementById(loadingId)) document.getElementById(loadingId).remove();
                chat.innerHTML += `<div class="msg ai" style="color:#ff6b6b">Network Error: ${error.message}</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
