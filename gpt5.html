<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Cloud Restrictions ke liye zaroori line -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Aaghaz AI | Auto-Detect</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: 'Manrope', sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        .header { padding: 15px; border-bottom: 1px solid #333; text-align: center; font-weight: bold; color: #D4F614; display: flex; justify-content: space-between; align-items: center; }
        .status { font-size: 0.8rem; color: #888; background: #111; padding: 5px 10px; border-radius: 20px; border: 1px solid #333; }
        
        .chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; line-height: 1.5; font-size: 0.95rem; }
        .user { align-self: flex-end; background: #222; color: white; }
        .ai { align-self: flex-start; background: rgba(212, 246, 20, 0.1); border: 1px solid #333; color: #e4e4e7; }
        .system { align-self: center; background: #111; border: 1px solid #333; font-size: 0.8rem; color: #888; text-align: center; }
        .error-msg { background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; align-self: center; }

        .input-area { padding: 20px; border-top: 1px solid #333; background: #000; display: flex; gap: 10px; }
        input { flex: 1; background: #111; border: 1px solid #333; color: white; padding: 12px; border-radius: 8px; outline: none; }
        button { background: #D4F614; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; color: black; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="header">
        <span>Aaghaz AI</span>
        <span class="status" id="modelStatus">Checking Models...</span>
    </div>

    <div class="chat-box" id="chat">
        <div class="msg system" id="initMsg">Connecting to Google API to find working models...</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type message..." disabled>
        <button id="sendBtn" onclick="handleUserMessage()" disabled>Send</button>
    </div>

    <script>
        // 👇👇 YAHAN APNI KEY PASTE KAREIN 👇👇
        const API_KEY = "AIzaSyCgXWi5fsP2-Da2xbNOZMpbhGaggKFJvLE"; 
        // ---------------------------------------

        const chat = document.getElementById('chat');
        const modelStatus = document.getElementById('modelStatus');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const initMsg = document.getElementById('initMsg');

        let ACTIVE_MODEL = ""; // Ye auto-fill hoga

        // Step 1: Automatically find a working model
        async function findWorkingModel() {
            if(API_KEY.includes("PASTE")) {
                showError("API Key missing in code.");
                return;
            }

            try {
                // Google se pucho: "Mere liye kaunse models available hain?"
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${API_KEY}`);
                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                if (data.models) {
                    // Filter: Sirf wo models dhoondo jo Chat ("generateContent") support karte hain
                    const chatModel = data.models.find(m => 
                        m.supportedGenerationMethods.includes("generateContent") && 
                        (m.name.includes("flash") || m.name.includes("pro"))
                    );

                    if (chatModel) {
                        // "models/gemini-1.5-flash" -> "gemini-1.5-flash" convert karo
                        ACTIVE_MODEL = chatModel.name.replace("models/", "");
                        
                        // UI Update
                        modelStatus.innerText = "🟢 Connected: " + ACTIVE_MODEL;
                        modelStatus.style.color = "#D4F614";
                        modelStatus.style.borderColor = "#D4F614";
                        initMsg.innerText = "Ready! Using model: " + ACTIVE_MODEL;
                        enableInput();
                    } else {
                        showError("No chat models found in your API list.");
                    }
                } else {
                    showError("Empty model list received.");
                }
            } catch (error) {
                console.error(error);
                // Fallback: Agar list fail ho jaye, to purana 'gemini-pro' try karo
                checkFallback();
            }
        }

        // Fallback agar ListModels fail ho jaye (Permissions ki waja se)
        async function checkFallback() {
            ACTIVE_MODEL = "gemini-1.5-flash"; // Force try standard model
            modelStatus.innerText = "⚠️ Fallback Mode";
            initMsg.innerText = "List failed. Trying direct connection...";
            enableInput();
        }

        function enableInput() {
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }

        function showError(msg) {
            initMsg.innerText = "Error: " + msg;
            initMsg.style.color = "#fca5a5";
            initMsg.style.background = "#450a0a";
        }

        // Step 2: Message bhejna
        async function handleUserMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // UI
            chat.innerHTML += `<div class="msg user">${text}</div>`;
            userInput.value = '';
            chat.scrollTop = chat.scrollHeight;

            const loadingId = 'load-' + Date.now();
            chat.innerHTML += `<div class="msg ai" id="${loadingId}">...</div>`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${ACTIVE_MODEL}:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.error) {
                    chat.innerHTML += `<div class="msg error-msg">${data.error.message}</div>`;
                } else {
                    const aiText = data.candidates[0].content.parts[0].text;
                    const formatted = aiText.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
                    chat.innerHTML += `<div class="msg ai">${formatted}</div>`;
                }

            } catch (error) {
                if(document.getElementById(loadingId)) document.getElementById(loadingId).remove();
                chat.innerHTML += `<div class="msg error-msg">Network Error</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }

        // Run on Load
        window.onload = findWorkingModel;

        // Enter Key Support
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleUserMessage();
        });

    </script>
</body>
</html>
