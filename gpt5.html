<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Aaghaz | AI Chat</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- THEME VARIABLES --- */
        :root {
            --bg-body: #000000;
            --bg-sidebar: #050505;
            --bg-card: #121212;
            --accent: #D4F614; 
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --border: #27272a;
            --sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            height: 100vh;
            display: flex;
            overflow: hidden; 
        }

        /* --- MOBILE OVERLAY (Dark Background when menu opens) --- */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 998;
            display: none; backdrop-filter: blur(3px);
        }
        .overlay.active { display: block; }

        /* --- SIDEBAR DESIGN --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            padding: 20px;
            flex-shrink: 0;
            height: 100%;
            z-index: 999;
            transition: transform 0.3s ease-in-out;
        }

        .logo { font-size: 1.2rem; font-weight: 800; margin-bottom: 25px; display: flex; gap: 10px; align-items: center; color: white; }
        .logo i { color: var(--accent); }

        /* User Profile Card */
        .user-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .user-avatar {
            width: 50px; height: 50px; background: #222; color: #fff;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: 600; margin: 0 auto 10px; border: 1px solid #333;
        }
        .user-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 2px; }
        .user-email { font-size: 0.75rem; color: #666; margin-bottom: 10px; word-break: break-all; }
        .badge { 
            background: #1e3a8a; color: #93c5fd; padding: 4px 12px; 
            border-radius: 20px; font-size: 0.7rem; font-weight: 700; display: inline-block; 
        }

        /* Navigation */
        .nav-menu { list-style: none; display: flex; flex-direction: column; gap: 5px; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 15px;
            border-radius: 8px; color: var(--text-muted); text-decoration: none;
            font-size: 0.9rem; font-weight: 500; transition: 0.2s;
        }
        .nav-item:hover { background: #1a1a1a; color: white; }
        .nav-item.active { 
            background: rgba(212, 246, 20, 0.05); 
            color: var(--accent); 
            border-left: 3px solid var(--accent); 
        }
        .logout { color: #ef4444; margin-top: auto; }
        .logout:hover { background: rgba(239, 68, 68, 0.1); color: #ef4444; }

        /* --- MAIN CHAT AREA --- */
        .chat-container {
            flex: 1; position: relative; display: flex; flex-direction: column;
            background: radial-gradient(circle at bottom center, #1a0b2e 0%, #000000 60%);
            width: 100%;
        }

        /* Mobile Top Bar (Only visible on mobile) */
        .mobile-top-bar {
            display: none; /* Hidden on desktop */
            align-items: center; justify-content: space-between;
            padding: 15px 20px;
            background: rgba(0,0,0,0.8);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }
        .menu-btn { font-size: 1.4rem; color: white; cursor: pointer; }
        .mobile-logo { font-weight: 800; font-size: 1.1rem; color: var(--accent); }

        /* Welcome Screen */
        .welcome-screen {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; width: 90%; padding: 20px; z-index: 1;
        }
        .welcome-title { font-size: 2.5rem; font-weight: 700; margin-bottom: 15px; }
        .welcome-sub { color: #999; font-size: 1rem; line-height: 1.6; max-width: 500px; margin: 0 auto; }

        /* Messages List */
        .chat-window {
            flex: 1; overflow-y: auto; padding: 20px 15%; 
            display: flex; flex-direction: column; gap: 20px; z-index: 2;
            padding-bottom: 120px; 
        }
        .message { display: flex; gap: 15px; max-width: 100%; line-height: 1.6; font-size: 0.95rem; }
        .msg-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: bold; font-size: 0.8rem; }
        .user-msg { flex-direction: row-reverse; }
        .user-msg .msg-content { background: #222; padding: 10px 16px; border-radius: 12px; border-top-right-radius: 2px; }
        .ai-msg .msg-content { background: transparent; padding-top: 5px; color: #eee; }
        .msg-avatar.ai { background: var(--accent); color: black; }
        .msg-avatar.user { background: #333; color: white; }

        /* Input Area (Floating) */
        .input-wrapper {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 70%; max-width: 800px; z-index: 10;
        }
        .input-box {
            background: #0f0f0f; border: 1px solid #333; border-radius: 12px;
            padding: 8px 15px; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .input-box i.fa-globe { color: #555; font-size: 1.1rem; }
        .input-box textarea {
            flex: 1; background: transparent; border: none; outline: none;
            color: white; resize: none; padding: 10px 0; font-size: 1rem; max-height: 100px;
        }
        .send-btn {
            width: 35px; height: 35px; background: var(--accent); color: black;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            border: none; cursor: pointer; transition: 0.2s;
        }
        .send-btn:hover { transform: scale(1.1); }
        .send-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

        /* WhatsApp Icon */
        .whatsapp-float {
            position: fixed; bottom: 30px; right: 30px;
            background: #25D366; color: white; width: 50px; height: 50px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; cursor: pointer; z-index: 20; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* --- MOBILE RESPONSIVE (SLIDE BAR LOGIC) --- */
        @media (max-width: 900px) {
            .mobile-top-bar { display: flex; } /* Show Menu Bar */
            
            .sidebar { 
                position: fixed; 
                top: 0; left: 0; height: 100%; 
                transform: translateX(-100%); /* Hide by default */
                width: 280px;
            }
            
            .sidebar.active { transform: translateX(0); } /* Slide in */
            
            .input-wrapper { width: 90%; bottom: 20px; }
            .chat-window { padding: 20px; padding-top: 10px; }
            .welcome-title { font-size: 1.8rem; }
            .welcome-screen { top: 40%; }
        }
    </style>
</head>
<body>

    <!-- OVERLAY FOR MOBILE -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="logo"><i class="fa-solid fa-bolt"></i> Aaghaz</div>
        
        <div class="user-card">
            <div class="user-avatar">U</div>
            <div class="user-name">User</div>
            <div class="user-email">teamzerosquare@gmail.com</div>
            <div class="badge">Free Member</div>
        </div>

        <nav class="nav-menu">
            <a href="#" class="nav-item"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="#" class="nav-item"><i class="fa-solid fa-layer-group"></i> Free Resources</a>
            <a href="#" class="nav-item active"><i class="fa-solid fa-comment-dots"></i> AI Chat (GPT-5)</a>
            <a href="#" class="nav-item"><i class="fa-regular fa-calendar"></i> Events</a>
            <a href="#" class="nav-item"><i class="fa-solid fa-robot"></i> AI Tools</a>
            <a href="#" class="nav-item logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="chat-container">
        
        <!-- MOBILE TOP BAR (New Feature) -->
        <div class="mobile-top-bar">
            <i class="fa-solid fa-bars menu-btn" onclick="toggleSidebar()"></i>
            <span class="mobile-logo">Aaghaz AI</span>
            <div style="width: 24px;"></div> <!-- Spacer for balance -->
        </div>

        <!-- Welcome Screen -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-title">Welcome to AI Chat</div>
            <div class="welcome-sub">Start a conversation by typing your message below. I'm here to help with any questions or tasks you have.</div>
        </div>

        <!-- Messages Area -->
        <div class="chat-window" id="chatWindow"></div>

        <!-- Input Area -->
        <div class="input-wrapper">
            <div class="input-box">
                <i class="fa-solid fa-globe"></i>
                <textarea id="userInput" rows="1" placeholder="Message AI Chat..." oninput="autoResize(this)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="fa-solid fa-arrow-up"></i></button>
            </div>
        </div>

        <!-- WhatsApp Icon -->
        <div class="whatsapp-float"><i class="fa-brands fa-whatsapp"></i></div>

    </main>

    <!-- JAVASCRIPT (AUTO-DETECT LOGIC) -->
    <script>
        // 👇👇 PASTE YOUR KEY HERE 👇👇
        const API_KEY = "AIzaSyCgXWi5fsP2-Da2xbNOZMpbhGaggKFJvLE"; 
        // -----------------------------

        let ACTIVE_MODEL = "gemini-1.5-flash"; // Default fallback
        const chatWindow = document.getElementById('chatWindow');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        // Toggle Sidebar Function
        function toggleSidebar() {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        // 1. Auto-Detect Logic (Silent)
        async function initModel() {
            if(API_KEY.includes("PASTE")) return; // Do nothing if no key

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${API_KEY}`);
                const data = await response.json();

                if (data.models) {
                    const model = data.models.find(m => 
                        m.supportedGenerationMethods.includes("generateContent") && 
                        (m.name.includes("flash") || m.name.includes("pro"))
                    );
                    if(model) ACTIVE_MODEL = model.name.replace("models/", "");
                }
            } catch (e) {
                console.log("Using Default Model");
            }
        }

        // 2. Send Message Logic
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // UI Updates
            welcomeScreen.style.display = 'none';
            addMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;

            const loadingId = 'load-' + Date.now();
            addMessage('Thinking...', 'ai', loadingId);

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${ACTIVE_MODEL}:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.error) {
                    addMessage("Error: " + data.error.message, 'ai');
                } else {
                    const rawText = data.candidates[0].content.parts[0].text;
                    const formatted = rawText.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
                    addMessage(formatted, 'ai');
                }

            } catch (error) {
                if(document.getElementById(loadingId)) document.getElementById(loadingId).remove();
                addMessage("Network Error. Check connection.", 'ai');
            }

            sendBtn.disabled = false;
        }

        function addMessage(text, type, id=null) {
            const div = document.createElement('div');
            div.className = `message ${type}-msg`;
            
            const avatar = type === 'user' ? 'U' : '<i class="fa-solid fa-bolt"></i>';
            const avatarClass = type; 

            let html = `
                <div class="msg-avatar ${avatarClass}">${avatar}</div>
                <div class="msg-content" ${id ? `id="${id}"` : ''}>${text}</div>
            `;
            
            if(type === 'user') {
                html = `
                    <div class="msg-content">${text}</div>
                    <div class="msg-avatar ${avatarClass}">${avatar}</div>
                `;
            }

            div.innerHTML = html;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // Init
        window.onload = initModel;
        
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
