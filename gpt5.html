<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aaghaz AI | AI Chat (GPT-5)</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- VARIABLES --- */
        :root {
            --bg-body: #000000;
            --bg-sidebar: #050505;
            --accent-green: #D4F614; 
            --accent-dim: rgba(212, 246, 20, 0.1);
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --border-color: #1a1a1a;
            --sidebar-width: 270px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { background-color: var(--bg-body); color: var(--text-main); height: 100vh; overflow: hidden; }
        button { cursor: pointer; border: none; outline: none; transition: 0.2s; }

        /* --- LAYOUT --- */
        .app-container { display: flex; height: 100vh; width: 100%; position: relative; }

        /* --- MOBILE HEADER --- */
        .mobile-header {
            display: none; position: fixed; top: 0; width: 100%; height: 60px;
            background: var(--bg-sidebar); border-bottom: 1px solid var(--border-color);
            z-index: 1000; padding: 0 20px; align-items: center; justify-content: space-between;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width); background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color); height: 100%;
            display: flex; flex-direction: column; padding: 25px 15px; flex-shrink: 0;
            z-index: 1100; transition: transform 0.3s ease-in-out;
        }

        .logo { font-size: 1.5rem; font-weight: 800; margin-bottom: 35px; display: flex; gap: 10px; align-items: center; padding-left: 10px; }
        .logo i { color: var(--accent-green); }

        .user-profile {
            background: #0d0d0d; padding: 20px; border-radius: 12px;
            border: 1px solid #1a1a1a; margin-bottom: 30px; text-align: center;
        }
        .avatar-circle {
            width: 55px; height: 55px; background: #1a1a1a; border-radius: 50%;
            margin: 0 auto 12px; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 1.2rem; color: #666; border: 1px solid #333;
        }
        .user-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
        .user-email { color: #555; font-size: 0.75rem; display: block; margin-bottom: 12px; word-break: break-all; }
        .user-badge { background: rgba(30, 64, 175, 0.3); color: #60a5fa; font-size: 0.65rem; padding: 4px 12px; border-radius: 20px; font-weight: 700; }

        .nav-menu { display: flex; flex-direction: column; gap: 8px; }
        .nav-item {
            padding: 12px 15px; border-radius: 10px; color: #888; text-decoration: none;
            font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 12px;
        }
        .nav-item:hover { background: #111; color: white; }
        .nav-item i { width: 20px; text-align: center; font-size: 1.1rem; }
        .nav-item.active { background: #1a1a00; color: var(--accent-green); }

        /* --- CHAT MAIN AREA --- */
        .chat-main {
            flex: 1; display: flex; flex-direction: column; position: relative;
            background: #000; overflow: hidden;
        }

        /* Glowing Arc Effect */
        .chat-main::before {
            content: ''; position: absolute; bottom: -20%; left: 50%;
            transform: translateX(-50%); width: 120%; height: 70%;
            background: radial-gradient(circle, rgba(74, 52, 235, 0.4) 0%, rgba(0,0,0,0) 70%);
            z-index: 1; pointer-events: none; border-radius: 50%;
        }

        .chat-header-info {
            padding-top: 60px; text-align: center; z-index: 2; position: relative;
        }
        .chat-header-info h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 15px; }
        .chat-header-info p { color: #ccc; font-size: 0.95rem; max-width: 500px; margin: 0 auto; line-height: 1.6; }

        /* Messages Window */
        .messages-window {
            flex: 1; overflow-y: auto; padding: 20px 15%;
            display: flex; flex-direction: column; gap: 20px; z-index: 2; position: relative;
        }
        .messages-window::-webkit-scrollbar { width: 5px; }
        .messages-window::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }

        .message { display: flex; gap: 15px; animation: fadeIn 0.3s ease; }
        .msg-content { padding: 12px 18px; border-radius: 15px; font-size: 0.95rem; max-width: 80%; line-height: 1.6; }
        
        .message.user { flex-direction: row-reverse; }
        .message.user .msg-content { background: #111; border: 1px solid #222; color: #fff; }
        .message.ai .msg-content { background: transparent; color: #eee; }

        /* --- INPUT BOX (Matching Image) --- */
        .input-area {
            padding: 20px 15% 40px; position: relative; z-index: 5;
        }
        .input-container {
            background: rgba(10, 10, 10, 0.8); border: 1px solid #222;
            border-radius: 20px; padding: 15px 20px; backdrop-filter: blur(10px);
        }
        .input-container textarea {
            width: 100%; background: transparent; border: none; outline: none;
            color: white; font-size: 1rem; resize: none; min-height: 40px; max-height: 150px;
        }
        .input-bottom-row {
            display: flex; justify-content: space-between; align-items: center; margin-top: 10px;
        }
        .input-icons i { color: #555; font-size: 1.2rem; cursor: pointer; }
        .input-icons i:hover { color: #888; }
        
        .send-btn {
            background: var(--accent-green); color: #000; width: 35px; height: 35px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .send-btn:hover { transform: scale(1.1); }
        .send-btn:disabled { background: #333; opacity: 0.5; }

        /* Mobile Overlay */
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1050; }

        /* Whatsapp Float */
        .wa-float { position: fixed; bottom: 20px; right: 20px; background: #25D366; color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; z-index: 100; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 992px) {
            .sidebar { position: fixed; left: 0; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .mobile-header { display: flex; }
            .chat-main { padding-top: 60px; }
            .messages-window, .input-area { padding-left: 20px; padding-right: 20px; }
            .sidebar-overlay.active { display: block; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- Mobile Header -->
    <div class="mobile-header">
        <button onclick="toggleSidebar()" style="background:none; color:white; font-size:1.5rem;"><i class="fa-solid fa-bars"></i></button>
        <div style="font-weight:800; font-size:1.2rem;"><i class="fa-solid fa-bolt" style="color:var(--accent-green)"></i> Aaghaz</div>
        <div></div>
    </div>

    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="logo"><i class="fa-solid fa-bolt"></i> Aaghaz</div>
            
            <div class="user-profile">
                <div class="avatar-circle" id="userInitial">U</div>
                <div class="user-name" id="userName">User</div>
                <span class="user-email" id="userEmail">teamzerosquare@gmail.com</span>
                <span class="user-badge">Free Member</span>
            </div>

            <ul class="nav-menu">
                <li><a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i> Dashboard</a></li>
                <li><a href="#" class="nav-item"><i class="fa-solid fa-database"></i> Free Resources</a></li>
                <li><a href="chat.html" class="nav-item active"><i class="fa-regular fa-comment-dots"></i> AI Chat (GPT-5)</a></li>
                <li><a href="#" class="nav-item"><i class="fa-regular fa-calendar"></i> Events</a></li>
                <li><a href="#" class="nav-item"><i class="fa-solid fa-brain"></i> AI Tools</a></li>
                <li style="margin-top: auto;"><a href="#" onclick="logout()" class="nav-item" style="color:#ff4444;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
            </ul>
        </aside>

        <!-- CHAT AREA -->
        <main class="chat-main">
            <div id="welcome-content" class="chat-header-info">
                <h1>Welcome to AI Chat</h1>
                <p>Start a conversation by typing your message below. I'm here to help with any questions or tasks you have.</p>
            </div>

            <div class="messages-window" id="chatWindow">
                <!-- Messages will appear here -->
            </div>

            <div class="input-area">
                <div class="input-container">
                    <textarea id="userInput" rows="1" placeholder="Message AI Chat..." oninput="autoHeight(this)"></textarea>
                    <div class="input-bottom-row">
                        <div class="input-icons">
                            <i class="fa-solid fa-globe"></i>
                        </div>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="fa-solid fa-arrow-up"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <a href="#" class="wa-float"><i class="fa-brands fa-whatsapp"></i></a>

    <!-- SCRIPTS -->
    <!-- Baki upar ka HTML same rahega -->

<!-- SCRIPTS START -->
<!-- SCRIPTS START -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> 

<script>
    // 1. FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyACTKh1FPEeubC6HLRTshs2KxgRiLnTbHM",
        authDomain: "zero-square.firebaseapp.com",
        databaseURL: "https://zero-square-default-rtdb.firebaseio.com",
        projectId: "zero-square",
        storageBucket: "zero-square.firebasestorage.app",
        messagingSenderId: "564427825486",
        appId: "1:564427825486:web:9e9736e88d49a90eefbe1f"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // 2. GEMINI CONFIG (UPDATED & FIXED)
    // ⚠️ YAHAN APNI NAYI KEY PASTE KAREIN JO (aistudio.google.com) SE MILY
    const GEMINI_API_KEY = "AIzaSyCgXWi5fsP2-Da2xbNOZMpbhGaggKFJvLE"; 
    
    // MODEL: Hum 'gemini-1.5-flash' use kar rahe hain jo sabse latest aur fast hai
    // Agar ye bhi na chale to aapka internet/ISP Google API block kar raha hai
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

    // Auth State Check
    auth.onAuthStateChanged(user => {
        if (user) {
            const name = user.displayName || "User";
            if(document.getElementById('userName')) document.getElementById('userName').innerText = name;
            if(document.getElementById('userEmail')) document.getElementById('userEmail').innerText = user.email;
            if(document.getElementById('userInitial')) document.getElementById('userInitial').innerText = name.charAt(0).toUpperCase();
        }
    });

    const chatWindow = document.getElementById('chatWindow');
    const userInput = document.getElementById('userInput');
    const welcomeContent = document.getElementById('welcome-content');

    // --- MAIN SEND MESSAGE FUNCTION ---
    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // UI Updates
        if (welcomeContent) welcomeContent.style.display = 'none';
        addMessage(text, 'user');
        
        // Clear input
        userInput.value = '';
        userInput.style.height = 'auto';

        // Loading Indicator
        const loadingId = 'loading-' + Date.now();
        addMessage('<i class="fa-solid fa-spinner fa-spin"></i> Aaghaz is thinking...', 'ai', loadingId);
        scrollToBottom();

        try {
            // API Call
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: text }]
                    }]
                })
            });

            const data = await response.json();
            
            // Remove Loading
            const loadingMsg = document.getElementById(loadingId);
            if (loadingMsg) loadingMsg.remove();

            // Handle Specific Errors
            if (data.error) {
                console.error("Gemini API Error:", data.error);
                let errorMsg = "⚠️ Error: " + data.error.message;
                
                // Agar 'Not Found' error aaye, matlab Key galat hai ya Model enable nahi hai
                if (data.error.message.includes("not found") || data.error.code === 404) {
                    errorMsg = "⚠️ Error: Invalid API Key. Please get a new key from aistudio.google.com";
                }
                
                addMessage(errorMsg, 'ai');
                return;
            }

            // Success
            if (data.candidates && data.candidates[0].content) {
                const aiText = data.candidates[0].content.parts[0].text;
                addMessage(formatText(aiText), 'ai');
            } else {
                addMessage("⚠️ Empty response. Please try again.", 'ai');
            }

        } catch (error) {
            // Network Error
            const loadingMsg = document.getElementById(loadingId);
            if (loadingMsg) loadingMsg.remove();
            console.error("Network Error:", error);
            addMessage("❌ Connection Failed. Check your internet or API Key.", 'ai');
        }
    }

    // --- HELPER FUNCTIONS ---
    function addMessage(text, sender, id = null) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        if (id) div.id = id;
        
        if (sender === 'user') {
            div.innerHTML = `<div class="msg-content"></div>`;
            div.querySelector('.msg-content').textContent = text;
        } else {
            div.innerHTML = `<div class="msg-content">${text}</div>`;
        }
        
        chatWindow.appendChild(div);
        scrollToBottom();
    }

    function formatText(text) {
        if (!text) return "";
        // Formatting Logic
        text = text.replace(/```([\s\S]*?)```/g, '<pre style="background:#222; padding:10px; border-radius:5px; overflow-x:auto;"><code>$1</code></pre>');
        text = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        text = text.replace(/\*(.*?)\*/g, '<i>$1</i>');
        text = text.replace(/\n/g, '<br>');
        return text;
    }

    function autoHeight(el) {
        el.style.height = 'auto';
        el.style.height = (el.scrollHeight) + 'px';
    }

    function scrollToBottom() { 
        chatWindow.scrollTop = chatWindow.scrollHeight; 
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('active');
    }

    function logout() {
        if(confirm("Are you sure you want to logout?")) {
            auth.signOut().then(() => window.location.href = 'index.html');
        }
    }

    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>
</body>
</html>
